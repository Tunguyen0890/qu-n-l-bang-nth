<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BẢNG XẾP TEAM BANG CHIẾN</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      padding: 15px;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    h1 { color: var(--accent-color); font-size: 24px; margin-bottom: 8px; }
    .status-bar { font-size: 14px; color: var(--text-sub); }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .class-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
    }

    .class-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .member-list { list-style: none; }
    .member-item {
      background: #0f172a;
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 5px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    .busy-card { grid-column: 1 / -1; border-color: #ef4444; }
    .busy-card .class-title { color: #f87171; }
    .empty-text { font-style: italic; color: var(--text-sub); font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <h1 id="session-title">⏳ Đang tải dữ liệu điểm danh...</h1>
    <div class="status-bar">
      Trạng thái: <span id="status-text" style="color: #4ade80;">Đang kết nối...</span> | 
      Tổng tham gia: <b id="total-count" style="color: var(--accent-color);">0</b> người
    </div>
  </header>

  <div id="content" class="grid-container"></div>

  <script>
    // Lấy ID server từ đường dẫn URL
    const urlParams = new URLSearchParams(window.location.search);
    const guildId = urlParams.get('guild');

    const CLASS_NAMES = {
      culinh: 'Cửu Linh',
      thantuong: 'Thần Tướng',
      thiety: 'Thiết Y',
      toaimong: 'Toái Mộng',
      longngam: 'Long Ngâm',
      tovan: 'Tố Vấn',
      huyetha: 'Huyết Hà'
    };

    async function fetchData() {
      if (!guildId) {
        document.getElementById('session-title').innerText = "⚠️ Đường link thiếu ?guild=ID";
        return;
      }

      try {
        // Tự gọi về IP/Domain của Bot ở cổng 31324
        const res = await fetch(`http://bangbig.aecaykhe.fun:31324/api/data?guild=${guildId}`);
        const result = await res.json();

        if (result.success && result.data) {
          const data = result.data;
          document.getElementById('session-title').innerText = "⚔️ " + data.title;
          document.getElementById('status-text').innerText = data.isOpen ? "🟢 Đang mở báo danh" : "🔴 Đã đóng";

          let html = "";
          let totalMembers = 0;

          // Render danh sách Báo Bận
          if (data.busyList && data.busyList.length > 0) {
            html += `<div class="class-card busy-card"><div class="class-title"><span>⚠️ Báo Bận</span><span>${data.busyList.length}</span></div><ul class="member-list">`;
            data.busyList.forEach((b, i) => {
              html += `<li class="member-item"><span><b>${i + 1}. ${b.ingame}</b></span> <span style="color:#f87171;">${b.reason}</span></li>`;
            });
            html += `</ul></div>`;
          }

          // Render các phái
          for (const [classId, className] of Object.entries(CLASS_NAMES)) {
            const list = data.members?.[classId] || [];
            totalMembers += list.length;

            html += `<div class="class-card"><div class="class-title"><span>⚔️ ${className}</span><span>${list.length}</span></div><ul class="member-list">`;
            if (list.length === 0) {
              html += `<li class="empty-text">Chưa có ai đăng ký</li>`;
            } else {
              list.forEach((m, i) => {
                html += `<li class="member-item"><span><b>${i + 1}.</b> ${m.name}</span></li>`;
              });
            }
            html += `</ul></div>`;
          }

          document.getElementById('total-count').innerText = totalMembers;
          document.getElementById('content').innerHTML = html;
        } else {
          document.getElementById('session-title').innerText = "❌ Không tìm thấy dữ liệu điểm danh!";
        }
      } catch (err) {
        document.getElementById('session-title').innerText = "⚠️ Mất kết nối tới Server Bot!";
      }
    }

    fetchData();
    setInterval(fetchData, 2000); // Lặp lại sau mỗi 2 giây
  </script>
</body>
</html>
