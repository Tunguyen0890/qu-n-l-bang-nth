    <!-- ═══ FONT: CẮT MỘT CHẶNG, MỞ SỚM HAI KẾT NỐI (sổ soi 20/08, mục G7) ═══
         Chuỗi phụ thuộc TRƯỚC đợt này, đo trên bản đã build:

           index.html → CSS (chặn dựng hình) → parse xong mới phát hiện @import
           → fonts.googleapis.com (DNS+TCP+TLS MỚI) → fonts.gstatic.com
           (DNS+TCP+TLS MỚI) → woff2

         Ba chặng NỐI TIẾP, không chặng nào bắt đầu trước khi chặng trước xong.
         Với RTT ~100ms trên 4G, hai kết nối lạnh nối tiếp là ~600–900ms.

         Hai việc ở đây cắt hai chặng đầu:
           · `preconnect` mở sẵn DNS+TCP+TLS tới cả hai host NGAY khi HTML được
             đọc, thay vì đợi CSS parse xong;
           · `<link rel="stylesheet">` thay cho `@import` trong `index.css` bỏ
             hẳn chặng "phải parse CSS mới biết cần gì".

         `crossorigin` trên preconnect tới `gstatic` là BẮT BUỘC: tệp font tải
         theo chế độ CORS, và một kết nối đã mở KHÔNG-CORS không dùng lại được
         cho nó — thiếu thuộc tính này thì preconnect vừa vô dụng vừa tốn một
         kết nối thừa.

         VÌ SAO KHÔNG `preload` LUÔN TỆP WOFF2: URL của tệp nằm TRONG stylesheet
         của Google và đổi theo lần Google cập nhật bộ chữ. Ghim nó vào đây là
         hẹn một ngày `preload` trỏ vào 404 — và trình duyệt vẫn tải font thật ở
         một request khác, tức trả tiền hai lần.

         Font thư pháp (`/fonts/hl-thuphap.woff2`) thì NGƯỢC LẠI: nó là tệp của
         chính repo, đường dẫn cố định, và nó tô tiêu đề hero — đúng thứ gây
         nhảy chữ khi swap. Cái đó preload được. -->
    <link rel="preconnect" href="https://fonts.googleapis.com/">

    <!-- ═══ CHẾ ĐỘ TỐI PHẢI ĐƯỢC QUYẾT ĐỊNH TRƯỚC LẦN VẼ ĐẦU (plan 132) ═══════
         Đây là script ĐỒNG BỘ, KHÔNG `defer`, KHÔNG `type="module"`, và nằm
         TRONG `<head>` — cả ba điều đó đều bắt buộc, vì cùng một lý do.

         `main.tsx` là module: trình duyệt hoãn nó tới sau khi dựng xong DOM.
         Đặt việc gắn `data-theme` vào React nghĩa là trang được vẽ MỘT KHUNG
         HÌNH bằng bảng màu sáng rồi mới lật sang tối — một cú loé trắng toàn
         màn, đúng vào thứ mà người bật chế độ tối đang cố tránh, và nó loé ở
         MỌI lần tải trang chứ không phải lần đầu.

         Bốn dòng dưới đây chép lại `giaiCheDo()` của `src/lib/theme.ts`, và đó
         là một bản sao CÓ CHỦ Ý — nó không thể `import` gì (import là module,
         module là hoãn). `src/theme.test.ts` gác việc hai bản không được lệch:
         nó đọc chính file HTML này và đòi khoá, ba giá trị hợp lệ, cùng tên
         thuộc tính phải khớp module.

         `try` bọc kín: `localStorage` ném ngay ở lượt ĐỌC khi trình duyệt chặn
         site data, và một cú ném trong `<head>` thì chặn luôn phần còn lại của
         trang. Ném thì rơi về đúng nhánh "theo hệ điều hành". -->
    <script>
      (function () {
        try {
          var v = null;
          try { v = localStorage.getItem('slay_theme'); } catch (e) {}
          var toi = v === 'toi' || (v !== 'sang' &&
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', toi ? 'toi' : 'sang');
          document.documentElement.style.colorScheme = toi ? 'dark' : 'light';
        } catch (e) {}
      })();
